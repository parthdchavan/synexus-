<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synexus — Embedded Security Workbench</title>
    <!-- Prevent theme flash before first paint + support query param theme override -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var queryTheme = params.get('theme');
          var mode = queryTheme || localStorage.getItem('synexus_theme') || 'dark';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-0 text-text-primary antialiased selection:bg-accent/20 selection:text-accent font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
